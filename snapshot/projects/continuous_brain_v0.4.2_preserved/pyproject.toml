[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-brain"
version = "0.4.2"
description = "A persistent neural agent with lifetime learning, frozen foundation perception, and optional 3-D AI2-THOR embodiment with curriculum action masking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
thor = ["ai2thor"]
vision = [
  "transformers>=4.56",
  "pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
continuous-brain = "continuous_brain.cli:main"

[tool.setuptools.packages.find]
include = ["continuous_brain*"]

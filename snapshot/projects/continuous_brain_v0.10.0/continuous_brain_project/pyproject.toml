[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-brain"
version = "0.10.0"
description = "A persistent embodied neural individual with raw trainable cortices, external developmental parents, autobiographical memory, and gradual weaning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
thor = ["ai2thor"]
vision = [
  "transformers>=4.56,<5",
  "huggingface_hub>=0.34,<1.0",
  "pillow>=10",
]
semantic = [
  "transformers>=4.56,<5",
  "huggingface_hub>=0.34,<1.0",
  "pillow>=10",
]
parents = [
  "transformers>=4.56,<5",
  "huggingface_hub>=0.34,<1.0",
  "pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
continuous-brain = "continuous_brain.cli:main"
continuous-individual = "continuous_brain.individual_cli:main"
continuous-semantic = "continuous_brain.semantic_cli:main"
continuous-parented = "continuous_brain.parented_cli:main"

[tool.setuptools.packages.find]
include = ["continuous_brain*"]

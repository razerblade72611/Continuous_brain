[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2thor-agent"
version = "0.4.1"
description = "Modular AI2-THOR agent with planning, verification, recovery, memory, and optional local LLM/VLM services."
requires-python = ">=3.10"
dependencies = [
  "ai2thor>=4.3.0,<5.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "rich>=13.7.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
thor-agent = "agent_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

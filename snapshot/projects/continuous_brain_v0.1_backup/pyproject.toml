[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuous-brain"
version = "0.1.0"
description = "A small continuously running neural agent with persistent state, episodic memory, world prediction, and online replay learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.scripts]
continuous-brain = "continuous_brain.cli:main"

[tool.setuptools.packages.find]
include = ["continuous_brain*"]
